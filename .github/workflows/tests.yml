name: Run E2E & Visual Autotests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f test_ServMain-pet-proect/requirements.txt ]; then pip install -r test_ServMain-pet-proect/requirements.txt; fi
          if [ -f tests/requirements.txt ]; then pip install -r tests/requirements.txt; fi
          pip install pytest pytest-playwright playwright allure-pytest pytest-snapshot

      - name: 4. Install Playwright Browsers with dependencies
        run: |
          python -m playwright install chromium --with-deps

      - name: 5. Start Application Stack (Docker Compose)
        env:
          POST_PASSWORD: ${{ secrets.POST_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          LIQPAY_PUBLIC_KEY: ${{ secrets.LIQPAY_PUBLIC_KEY }}
          LIQPAY_PRIVATE_KEY: ${{ secrets.LIQPAY_PRIVATE_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          # 1. Створюємо головний .env для Docker & Backend
          cat <<EOF > .env
          POST_PASSWORD=${POST_PASSWORD}
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=${POST_PASSWORD}
          POSTGRES_DB=postgres
          POSTGRES_URL=postgresql://postgres:${POST_PASSWORD}@db:5432/postgres
          DATABASE_URL=postgresql://postgres:${POST_PASSWORD}@db:5432/postgres
          DB_URL=postgresql://postgres:${POST_PASSWORD}@db:5432/postgres
          SECRET_KEY=${SECRET_KEY}
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          LIQPAY_PUBLIC_KEY=${LIQPAY_PUBLIC_KEY}
          LIQPAY_PRIVATE_KEY=${LIQPAY_PRIVATE_KEY}
          NEWS_API_KEY=${NEWS_API_KEY}
          EOF

          # 2. Створюємо .env для автотестів
          cat <<EOF > test_ServMain-pet-proect/.env
          TEST_EMAIL=${TEST_EMAIL}
          TEST_USERNAME=${TEST_USERNAME}
          TEST_PASSWORD=${TEST_PASSWORD}
          EOF

          docker compose up -d --build

      - name: 5.1 Wait for Application to be ready
        run: |
          npx wait-on http://localhost:3000 -t 60000

      - name: 6. Run Pytest Suite
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: |
          python -m pytest test_ServMain-pet-proect/ --alluredir=allure-results

      - name: 6.2 Print Docker Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: 7. Upload Allure Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 5